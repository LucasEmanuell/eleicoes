# Publica o site no GitHub Pages a cada push em main. Publicar por aqui (em vez
# de "Deploy from a branch") não tem o limite de 10 publicações por hora, o que
# permite atualizar os dados a cada 2 minutos.
name: Publica o site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true  # chegou dado mais novo: o deploy antigo não importa mais
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
